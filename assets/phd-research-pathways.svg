<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Prospective PhD research directions across bioprocesses computational intelligence and biochips"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#123149}.heading{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#506e7d}.label{font-size:22px;font-weight:700}.details{font-size:16px;fill:#547183}.small{font-size:15px;fill:#547183}.node{fill:#eaf5f5;stroke:#c6e2e2;stroke-width:2}.arrow{stroke:#068e95;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#087f88}.white{fill:white}</style><rect width="1200" height="640" rx="28" fill="#f7fbfc"/><text x="600" y="68" class="heading" text-anchor="middle">Explore Research at SIBES</text><text x="600" y="109" class="sub" text-anchor="middle">From scientific questions to integrated bioengineering platforms</text><rect x="57" y="207" width="325" height="175" rx="18" class="node"/><text x="219.5" y="256" class="label" text-anchor="middle">Experimental Bioprocessing</text><text x="219.5" y="289" class="details" text-anchor="middle">Microfluidic systems</text><text x="219.5" y="314" class="details" text-anchor="middle">Continuous manufacturing</text><rect x="417" y="207" width="325" height="175" rx="18" class="node"/><text x="579.5" y="256" class="label" text-anchor="middle">Computational Intelligence</text><text x="579.5" y="289" class="details" text-anchor="middle">Modelling / CFD / ML</text><text x="579.5" y="314" class="details" text-anchor="middle">PAT and Digital Twins</text><rect x="777" y="207" width="325" height="175" rx="18" class="node"/><text x="939.5" y="256" class="label" text-anchor="middle">Smart Biochip Engineering</text><text x="939.5" y="289" class="details" text-anchor="middle">CAD and fabrication</text><text x="939.5" y="314" class="details" text-anchor="middle">Diagnostics and sensing</text><text x="600" y="476" class="sub" text-anchor="middle">Prospective PhD students: Apply through the university VITREE admission process</text><text x="600" y="527" class="small" text-anchor="middle">Other research positions depend on project needs, approvals and available funding.</text></svg>