<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Clean research theme diagram showing bioprocessing PAT chemometrics and digital twins"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#123149}.heading{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#506e7d}.label{font-size:22px;font-weight:700}.details{font-size:16px;fill:#547183}.small{font-size:15px;fill:#547183}.node{fill:#eaf5f5;stroke:#c6e2e2;stroke-width:2}.arrow{stroke:#068e95;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#087f88}.white{fill:white}</style><rect width="1200" height="640" rx="28" fill="#f7fbfc"/><text x="600" y="61" class="heading" text-anchor="middle">Theme 1 — Intelligent Bioprocess Engineering</text><text x="600" y="100" class="sub" text-anchor="middle">Engineering, measuring, modeling and improving the process</text><rect x="46" y="180" width="205" height="154" rx="18" class="node"/><text x="148.5" y="229" class="label" text-anchor="middle">Integrated processing</text><text x="148.5" y="262" class="details" text-anchor="middle">IVT • purification</text><text x="148.5" y="287" class="details" text-anchor="middle">Modular continuous flow</text><rect x="348" y="180" width="205" height="154" rx="18" class="node"/><text x="450.5" y="229" class="label" text-anchor="middle">PAT</text><text x="450.5" y="262" class="details" text-anchor="middle">In-line monitoring</text><text x="450.5" y="287" class="details" text-anchor="middle">Process &amp; quality data</text><rect x="650" y="180" width="205" height="154" rx="18" class="node"/><text x="752.5" y="229" class="label" text-anchor="middle">Chemometrics</text><text x="752.5" y="262" class="details" text-anchor="middle">PCA • PLS • soft sensors</text><text x="752.5" y="287" class="details" text-anchor="middle">ML prediction</text><rect x="952" y="180" width="205" height="154" rx="18" class="node"/><text x="1054.5" y="229" class="label" text-anchor="middle">Digital Twin</text><text x="1054.5" y="262" class="details" text-anchor="middle">Simulation and models</text><text x="1054.5" y="287" class="details" text-anchor="middle">Model-informed control</text><path class="arrow" d="M261 258 L331 258"/><path d="M318 249 L331 258 L318 267" fill="none" stroke="#068e95" stroke-width="4"/><path class="arrow" d="M563 258 L633 258"/><path d="M620 249 L633 258 L620 267" fill="none" stroke="#068e95" stroke-width="4"/><path class="arrow" d="M865 258 L935 258"/><path d="M922 249 L935 258 L922 267" fill="none" stroke="#068e95" stroke-width="4"/><path d="M1055 350 V415 H149 V350" stroke="#008e95" stroke-width="4" fill="none" stroke-dasharray="12 8"/><text x="600" y="455" class="sub" text-anchor="middle">Data and model feedback inform subsequent experiments and process optimization</text><text x="600" y="540" class="small" text-anchor="middle">Illustration of integrated research directions; not a claim that every element is experimentally deployed.</text></svg>